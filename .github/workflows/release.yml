name: Create Release on Tag

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A tag that disagrees with the manifest ships a resource claiming the
      # wrong version. Fail here rather than publish it.
      - name: Check tag matches fxmanifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(sed -n "s/^version[[:space:]]*'\([^']*\)'.*/\1/p" fxmanifest.lua)

          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not read version from fxmanifest.lua"
            exit 1
          fi

          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match fxmanifest version $MANIFEST"
            exit 1
          fi

          echo "Tag and manifest agree on $TAG"

      - name: Prepare Release Folder
        run: |
          mkdir "gg_lib"
          shopt -s extglob
          cp -r !(gg_lib|.git|.github) "gg_lib/"

      - name: Create ZIP Archive
        run: |
          zip -r "gg_lib.zip" "gg_lib"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: gg_lib.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
